name: Lint and Format

on:
  push:
    branches: ['main']

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npm run format:check

      - name: Suggest fixes on failure
        if: failure()
        run: |
          echo "::error title=Code Formatting/Linting Issues Found::Please run 'npm run lint:fix' and 'npm run format' locally and commit the changes."
